---
name: Test

on:
  push:
    # main runs the tests through build.yml, before building the image.
    branches-ignore: ['main']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    # Same-repo PRs already show the push run for their commit, so only test fork PRs here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: go tool revive -config revive.toml -formatter stylish ./...

      - name: Test
        run: go test -race ./...
