---
name: Test

on:
  push:
    # main runs the tests through build.yml, before building the image.
    branches-ignore: ['main']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: go tool revive -formatter=stylish -config=revive.toml ./...

      - name: Test
        run: go test -race ./...
